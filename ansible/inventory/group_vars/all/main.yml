---
# Defaults - most values get overridden through vars_prompt at runtime

matrix_base_domain: example.com
matrix_domains:
  synapse: "matrix.{{ matrix_base_domain }}"
  element: "element.{{ matrix_base_domain }}"
  admin: "synad.{{ matrix_base_domain }}"
  turn: "turn.{{ matrix_base_domain }}"
  livekit: "rtc.{{ matrix_base_domain }}"
  element_call: "call.{{ matrix_base_domain }}"

matrix_external_ip: ""

matrix_timezone: Etc/UTC

matrix_system_user: matrix
matrix_system_group: matrix
matrix_root_dir: /opt/matrix

postgresql_version: "18"
postgresql_image: "postgres:18"
postgresql_host_port: 5432
postgresql_connect_host: "postgres"
postgresql_synapse_db: synapse
postgresql_synapse_user: synapse
postgresql_synapse_password_length: 48

postgresql_conf_path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
postgresql_hba_path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
postgresql_service_name: postgresql

postgresql_tuning:
  shared_buffers_mb: 0  # Auto-calculated
  effective_cache_size_mb: 0
  maintenance_work_mem_mb: 512
  work_mem_mb: 0
  max_connections: 400

synapse_image: "matrixdotorg/synapse:latest"
synapse_container_name: synapse
synapse_uid: 991
synapse_gid: 991
synapse_data_dir: "{{ matrix_root_dir }}/synapse/data"
synapse_config_dir: "{{ synapse_data_dir }}"
synapse_app_service_dir: "{{ synapse_data_dir }}/appservices"
synapse_media_store: "{{ synapse_data_dir }}/media"
synapse_registration_shared_secret_len: 48
synapse_macaroon_secret_len: 48
synapse_form_secret_len: 48
synapse_report_stats: true

synapse_enable_metrics: true
synapse_enable_federation: true

docker_network_name: matrix-net
docker_network_subnet: 172.23.0.0/24
docker_network_gateway: 172.23.0.1

element_web_image: "vectorim/element-web:latest"
element_call_image: "ghcr.io/element-hq/element-call:latest"
synad_image: "ghcr.io/etkecc/synapse-admin:latest"
livekit_image: "livekit/livekit-server:latest"
livekit_config_path: "{{ livekit_root }}/livekit.yaml"

element_web_root: "{{ matrix_root_dir }}/element-web"
synad_root: "{{ matrix_root_dir }}/synad"
element_call_root: "{{ matrix_root_dir }}/element-call"
livekit_root: "{{ matrix_root_dir }}/livekit"
element_jwt_root: "{{ matrix_root_dir }}/element-jwt"

element_web_host_port: 8081
synad_host_port: 8082
element_call_host_port: 8083
element_jwt_port: 8084

livekit_http_port: 7880
livekit_ws_port: 7880
livekit_rtc_tcp_port: 7881
livekit_turn_udp_port: 3480
livekit_turn_tls_port: 5449
livekit_port_range_start: 62000
livekit_port_range_end: 62999

element_jwt_image: "ghcr.io/element-hq/lk-jwt-service:0.3.0"
element_jwt_full_access_homeservers:
  - "{{ matrix_domains.synapse }}"
  - "{{ matrix_base_domain }}"

nginx_sites_root: /var/www/matrix
nginx_well_known_dir: "{{ nginx_sites_root }}/.well-known/matrix"

coturn_realms:
  - "{{ matrix_domains.turn }}"
  - "{{ matrix_domains.synapse }}"

coturn_min_port: 57000
coturn_max_port: 57999
coturn_tls_port: 5349
coturn_udp_port: 3478
coturn_cert_path: /etc/turnserver/certs/fullchain.pem
coturn_key_path: /etc/turnserver/certs/privkey.pem

firewall_open_tcp:
  - 22
  - 80
  - 443
  - 8448
firewall_open_udp:
  - "{{ coturn_udp_port }}"
  - "{{ coturn_tls_port }}"
  - "{{ livekit_turn_udp_port }}"
livekit_ports_tcp:
  - "{{ livekit_http_port }}"
  - "{{ livekit_ws_port }}"
  - "{{ livekit_tls_port }}"
livekit_ports_udp:
  - "{{ livekit_udp_port }}"
