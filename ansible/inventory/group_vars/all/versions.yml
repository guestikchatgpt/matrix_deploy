---
# Tested/pinned application versions.
# Routine convergence must not silently move these tags forward.

postgresql_version: "18"
postgresql_image: "postgres:18.6"

# Production reference on 2026-08-18 ran Synapse 1.158.0 successfully.
synapse_image: "matrixdotorg/synapse:v1.158.0"

# Stable upstream releases used for deterministic deployment.
element_web_image: "vectorim/element-web:v1.12.20"
element_call_image: "ghcr.io/element-hq/element-call:v0.20.0"
livekit_image: "livekit/livekit-server:v1.13.5"
element_jwt_image: "ghcr.io/element-hq/lk-jwt-service:0.5.0"

# Ketesa currently documents the container `latest` channel as its supported
# drop-in deployment path. Keep this explicit exception visible until we adopt
# a verified immutable tag/digest policy for Ketesa.
synad_image: "ghcr.io/etkecc/ketesa:latest"
