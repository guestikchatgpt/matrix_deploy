---
- name: Run MatrixRTC authorization service
  community.docker.docker_container:
    name: element-jwt
    image: "{{ element_jwt_image }}"
    restart_policy: always
    pull: missing
    networks:
      - name: "{{ docker_network_name }}"
    published_ports:
      - "127.0.0.1:{{ element_jwt_host_port }}:8080"
    env:
      LIVEKIT_URL: "wss://{{ matrix_domains.livekit }}/livekit/sfu"
      LIVEKIT_KEY: "{{ livekit_api_key }}"
      LIVEKIT_SECRET: "{{ livekit_api_secret }}"
      LIVEKIT_JWT_BIND: "{{ element_jwt_bind }}"
      LIVEKIT_FULL_ACCESS_HOMESERVERS: >-
        {{ ([matrix_domains.synapse] + matrix_local_homeserver_aliases) | unique | join(',') }}
      LIVEKIT_LOG_LEVEL: info
    state: started
  no_log: true

- name: Wait for MatrixRTC authorization service
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ element_jwt_host_port }}/healthz"
    status_code: 200
    timeout: 5
  register: element_jwt_ready
  retries: 20
  delay: 2
  until: element_jwt_ready.status | default(0) == 200
  when: not ansible_check_mode
