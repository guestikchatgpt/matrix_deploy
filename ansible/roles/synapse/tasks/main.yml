---
- name: Create Synapse directories (uid/gid {{ synapse_uid }}:{{ synapse_gid }})
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ synapse_uid }}"
    group: "{{ synapse_gid }}"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    - { path: "{{ synapse_data_dir }}", mode: "0750" }
    - { path: "{{ synapse_media_store }}" }
    - { path: "{{ synapse_app_service_dir }}" }

- name: Generate Synapse secrets
  ansible.builtin.set_fact:
    synapse_registration_shared_secret: "{{ lookup('password', matrix_root_dir + '/.secrets/synapse_registration_shared_secret length=' + (synapse_registration_shared_secret_len | string) + ' chars=ascii_letters,digits') }}"
    synapse_macaroon_secret_key: "{{ lookup('password', matrix_root_dir + '/.secrets/synapse_macaroon_secret length=' + (synapse_macaroon_secret_len | string) + ' chars=ascii_letters,digits') }}"
    synapse_form_secret: "{{ lookup('password', matrix_root_dir + '/.secrets/synapse_form_secret length=' + (synapse_form_secret_len | string) + ' chars=ascii_letters,digits') }}"
  no_log: true

- name: Render homeserver.yaml (uid/gid {{ synapse_uid }}:{{ synapse_gid }})
  ansible.builtin.template:
    src: homeserver.yaml.j2
    dest: "{{ synapse_config_dir }}/homeserver.yaml"
    owner: "{{ synapse_uid }}"
    group: "{{ synapse_gid }}"
    mode: "0640"
  notify: Restart Synapse

- name: Render log.config (uid/gid {{ synapse_uid }}:{{ synapse_gid }})
  ansible.builtin.template:
    src: log.config.j2
    dest: "{{ synapse_config_dir }}/log.config"
    owner: "{{ synapse_uid }}"
    group: "{{ synapse_gid }}"
    mode: "0640"
  notify: Restart Synapse

- name: Run Synapse container
  community.docker.docker_container:
    name: "{{ synapse_container_name }}"
    image: "{{ synapse_image }}"
    restart_policy: always
    user: "{{ synapse_uid }}:{{ synapse_gid }}"
    pull: true
    networks:
      - name: "{{ docker_network_name }}"
    env:
      SYNAPSE_SERVER_NAME: "{{ matrix_domains.synapse }}"
      SYNAPSE_REPORT_STATS: "{{ synapse_report_stats | ternary('yes', 'no') }}"
      SYNAPSE_CONFIG_PATH: "/data/homeserver.yaml"
    volumes:
      - "{{ synapse_data_dir }}:/data"
    published_ports:
      - "127.0.0.1:8008:8008"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/_matrix/client/versions"]
      interval: 30s
      timeout: 5s
      retries: 5
    state: started
  register: synapse_container

- name: Wait for Synapse
  ansible.builtin.uri:
    url: http://127.0.0.1:8008/_matrix/client/versions
    status_code: 200
  register: synapse_up
  retries: 10
  delay: 6
  until: synapse_up.status == 200

- name: Check Synapse admin marker
  ansible.builtin.stat:
    path: "{{ synapse_config_dir }}/.admin_{{ matrix_admin_user }}"
  register: synapse_admin_marker

- name: Create Synapse admin user
  ansible.builtin.command: >
    docker exec {{ synapse_container_name }}
    register_new_matrix_user
    --config /data/homeserver.yaml
    --user {{ matrix_admin_user }}
    --password {{ matrix_admin_password }}
    --admin
    http://localhost:8008
  when: not synapse_admin_marker.stat.exists and matrix_admin_password | length > 0
  no_log: true
  register: synapse_admin_create
  changed_when: synapse_admin_create.rc == 0
  failed_when: synapse_admin_create.rc not in [0, 1]

- name: Touch Synapse admin marker
  ansible.builtin.file:
    path: "{{ synapse_config_dir }}/.admin_{{ matrix_admin_user }}"
    state: touch
    owner: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    mode: "0600"
  when:
    - not synapse_admin_marker.stat.exists
    - synapse_admin_create is defined
    - synapse_admin_create.rc == 0
