---
- name: Создать директорию Element Web
  ansible.builtin.file:
    path: "{{ element_web_root }}"
    state: directory
    owner: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    mode: "0750"

- name: Создать конфигурацию Element Web
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ element_web_root }}/config.json"
    owner: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    mode: "0644"
  notify: Restart Element Web

- name: Развернуть контейнер Element Web
  community.docker.docker_container:
    name: element-web
    image: "{{ element_web_image }}"
    restart_policy: always
    pull: missing
    networks:
      - name: "{{ docker_network_name }}"
    published_ports:
      - "127.0.0.1:{{ element_web_host_port }}:80"
    volumes:
      - "{{ element_web_root }}/config.json:/app/config.json"
    env:
      SERVER_NAME: "{{ matrix_domains.synapse }}"
      ELEMENT_WEB_PORT: "80"
    state: started
