---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3
      - python3-pip
      - python3-venv
      - python3-psycopg2
      - python3-debian
      - acl
      - openssl

- name: Install Docker Python SDK
  ansible.builtin.apt:
    name: python3-docker
    state: present

- name: Create Matrix system group
  ansible.builtin.group:
    name: "{{ matrix_system_group }}"
    system: true

- name: Create Matrix system user
  ansible.builtin.user:
    name: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Create stack root directory
  ansible.builtin.file:
    path: "{{ matrix_root_dir }}"
    state: directory
    owner: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    mode: "0750"

- name: Create secrets directory
  ansible.builtin.file:
    path: "{{ matrix_root_dir }}/.secrets"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Map host architecture to Debian repository architecture
  ansible.builtin.set_fact:
    matrix_deb_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] | default('') }}

- name: Require a supported CPU architecture
  ansible.builtin.assert:
    that:
      - matrix_deb_arch | length > 0
    fail_msg: "Unsupported architecture for Matrix Deploy: {{ ansible_facts['architecture'] }}"
