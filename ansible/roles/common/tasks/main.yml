---
- name: Обновить кеш apt
  apt:
    update_cache: true
    cache_valid_time: 86400

- name: Установить базовые пакеты
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3
      - python3-pip
      - python3-venv
      - python3-psycopg2
      - software-properties-common
      - acl
      - openssl

- name: Установить Python SDK Docker из официального PyPI
  ansible.builtin.apt:
    name: python3-docker
    state: latest

- name: Создать системную группу Matrix
  group:
    name: "{{ matrix_system_group }}"
    system: true

- name: Создать системного пользователя Matrix
  user:
    name: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Создать корневую директорию стека
  file:
    path: "{{ matrix_root_dir }}"
    state: directory
    owner: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    mode: "0750"

- name: Создать директорию для секретов
  file:
    path: "{{ matrix_root_dir }}/.secrets"
    state: directory
    owner: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    mode: "0700"

- name: Запомнить ресурсы хоста
  set_fact:
    matrix_total_memory_mb: "{{ ansible_memtotal_mb | int }}"
    matrix_total_vcpus: "{{ (ansible_processor_vcpus | default(ansible_processor_count | default(2))) | int }}"

- name: Рассчитать параметры PostgreSQL
  set_fact:
    postgresql_tuning:
      shared_buffers_mb: "{{ [[((matrix_total_memory_mb | int) * 0.25) | int, 8192] | min, 1024] | max }}"
      effective_cache_size_mb: "{{ [((matrix_total_memory_mb | int) * 0.75) | int, 2048] | max }}"
      maintenance_work_mem_mb: "{{ [((matrix_total_memory_mb | int) * 0.05) | int, 256] | max }}"
      work_mem_mb: "{{ [(((matrix_total_memory_mb | int) - (((matrix_total_memory_mb | int) * 0.25) | int)) / ((matrix_total_vcpus | int | default(2)) * 6)) | int, 8] | max }}"
      max_connections: "{{ [[((matrix_total_vcpus | int | default(2)) * 100), 800] | min, 200] | max }}"

- name: Вывести подсказку по ресурсам
  debug:
    msg:
      - "RAM: {{ matrix_total_memory_mb }} МБ"
      - "vCPU: {{ matrix_total_vcpus }}"
      - "PostgreSQL shared_buffers: {{ postgresql_tuning.shared_buffers_mb }} МБ"
      - "PostgreSQL work_mem: {{ postgresql_tuning.work_mem_mb }} МБ"
