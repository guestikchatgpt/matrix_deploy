---
- name: Обновить кеш apt
  apt:
    update_cache: true
    cache_valid_time: 86400

- name: Установить базовые пакеты
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3
      - python3-pip
      - python3-venv
      - python3-psycopg2
      - software-properties-common
      - acl
      - openssl

- name: Установить Python SDK Docker из официального PyPI
  ansible.builtin.apt:
    name: python3-docker
    state: latest

- name: Создать системную группу Matrix
  group:
    name: "{{ matrix_system_group }}"
    system: true

- name: Создать системного пользователя Matrix
  user:
    name: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Создать корневую директорию стека
  file:
    path: "{{ matrix_root_dir }}"
    state: directory
    owner: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    mode: "0750"

- name: Создать директорию для секретов
  file:
    path: "{{ matrix_root_dir }}/.secrets"
    state: directory
    owner: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    mode: "0700"
