---
- name: Install Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Install Matrix host Fail2ban baseline
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/00-matrix-base.local
    owner: root
    group: root
    mode: '0644'
    content: |
      [DEFAULT]
      backend = systemd
      bantime = 1h
      findtime = 10m
      maxretry = 5
      banaction = ufw

      [sshd]
      enabled = true
      backend = systemd
      port = {{ matrix_ssh_port }}
  register: fail2ban_matrix_config

- name: Validate Fail2ban configuration
  ansible.builtin.command: fail2ban-client -t
  changed_when: false

- name: Enable and start Fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Restart Fail2ban when managed configuration changes
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  when: fail2ban_matrix_config.changed

- name: Wait for Fail2ban control socket
  ansible.builtin.wait_for:
    path: /run/fail2ban/fail2ban.sock
    state: present
    timeout: 15

- name: Verify Fail2ban daemon responds
  ansible.builtin.command: fail2ban-client ping
  register: fail2ban_ping
  changed_when: false
  failed_when: "'Server replied: pong' not in fail2ban_ping.stdout"

- name: Verify SSH jail is active
  ansible.builtin.command: fail2ban-client status sshd
  changed_when: false
