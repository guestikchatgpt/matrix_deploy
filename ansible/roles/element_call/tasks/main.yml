---
- name: Create Element Call directory
  ansible.builtin.file:
    path: "{{ element_call_root }}"
    state: directory
    owner: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    mode: "0755"

- name: Create Element Call config.json
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ element_call_root }}/config.json"
    owner: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    mode: "0644"
  notify: Restart Element Call

- name: Deploy Element Call container
  community.docker.docker_container:
    name: element-call
    image: "{{ element_call_image }}"
    restart_policy: always
    pull: missing
    networks:
      - name: "{{ docker_network_name }}"
    ports:
      - "127.0.0.1:{{ element_call_host_port }}:8080"
    volumes:
      - "{{ element_call_root }}/config.json:/app/config.json:ro"
    state: started
