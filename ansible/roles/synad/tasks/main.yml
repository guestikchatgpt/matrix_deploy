---
- name: Create Ketesa configuration directory
  ansible.builtin.file:
    path: "{{ synad_root }}"
    state: directory
    owner: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    mode: '0750'

- name: Render Ketesa configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ synad_root }}/config.json"
    owner: "{{ matrix_system_user }}"
    group: "{{ matrix_system_group }}"
    mode: '0644'
  notify: Restart Ketesa

- name: Run Ketesa container
  community.docker.docker_container:
    name: synad
    image: "{{ synad_image }}"
    restart_policy: always
    pull: missing
    networks:
      - name: "{{ docker_network_name }}"
    published_ports:
      - "127.0.0.1:{{ synad_host_port }}:8080"
    volumes:
      - "{{ synad_root }}/config.json:/var/public/config.json:ro"
    env:
      SERVER_HOST: '0.0.0.0'
    # The image's own healthcheck probes http://localhost:8080; with the
    # IPv4-only bind above, "localhost" may resolve to ::1 inside the
    # container and report a working instance as unhealthy.
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
    state: started
