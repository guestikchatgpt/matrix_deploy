- name: Проверить поддержку репозитория Nginx для текущего дистрибутива
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_release in ["noble", "jammy", "focal"]
    fail_msg: "Официальный репозиторий nginx.org не поддерживает {{ ansible_distribution }} {{ ansible_distribution_release }}. Проверьте https://nginx.org/en/linux_packages.html и обновите конфигурацию."

- name: Получить ключ подписи Nginx
  ansible.builtin.get_url:
    url: https://nginx.org/keys/nginx_signing.key
    dest: /usr/share/keyrings/nginx-archive-keyring.gpg.asc
    mode: "0644"

- name: Импортировать ключ Nginx в формате gpg
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/nginx-archive-keyring.gpg /usr/share/keyrings/nginx-archive-keyring.gpg.asc
    creates: /usr/share/keyrings/nginx-archive-keyring.gpg

- name: Добавить репозиторий Nginx mainline
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] https://nginx.org/packages/mainline/ubuntu {{ ansible_distribution_release }} nginx"
    filename: nginx-mainline
    state: present

- name: Установить Nginx и Certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
    state: present
    update_cache: true

- name: Удалить дефолтный конфиг Nginx
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload Nginx

- name: Создать директорию webroot
  ansible.builtin.file:
    path: "{{ nginx_sites_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Создать директории .well-known
  ansible.builtin.file:
    path: "{{ nginx_sites_root }}/{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop:
    - ".well-known"
    - ".well-known/matrix"
    - ".well-known/acme-challenge"

- name: Разместить .well-known matrix/server
  ansible.builtin.template:
    src: well_known_server.json.j2
    dest: "{{ nginx_sites_root }}/.well-known/matrix/server"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Разместить .well-known matrix/client
  ansible.builtin.template:
    src: well_known_client.json.j2
    dest: "{{ nginx_sites_root }}/.well-known/matrix/client"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Проверить наличие веб-сертификата
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ matrix_domains.synapse }}/fullchain.pem"
  register: nginx_web_cert

- name: Проверить наличие TURN сертификата
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ matrix_domains.turn }}/fullchain.pem"
  register: nginx_turn_cert

- name: Установить bootstrap-конфигурацию Nginx для HTTP
  ansible.builtin.template:
    src: matrix-bootstrap.conf.j2
    dest: /etc/nginx/conf.d/00-matrix-bootstrap.conf
    owner: root
    group: root
    mode: "0644"
  when: not (nginx_web_cert.stat.exists and nginx_turn_cert.stat.exists)
  notify: Reload Nginx

- name: Убедиться что Nginx запущен
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Сформировать список доменов для основного сертификата
  ansible.builtin.set_fact:
    matrix_certbot_web_domains:
      - "{{ matrix_domains.synapse }}"
      - "{{ matrix_domains.element }}"
      - "{{ matrix_domains.admin }}"
      - "{{ matrix_domains.element_call }}"
      - "{{ matrix_domains.livekit }}"

- name: Выпросить сертификат для веб-доменов
  ansible.builtin.command: >
    certbot certonly --webroot
    --webroot-path {{ nginx_sites_root }}
    --non-interactive --agree-tos
    --email {{ certbot_email }}
    {% for domain in matrix_certbot_web_domains -%}
    -d {{ domain }}
    {% endfor -%}
  args:
    creates: "/etc/letsencrypt/live/{{ matrix_domains.synapse }}/fullchain.pem"
  when: not nginx_web_cert.stat.exists
  register: certbot_web
  changed_when: certbot_web.rc == 0

- name: Выпросить сертификат для TURN
  ansible.builtin.command: >
    certbot certonly --webroot
    --webroot-path {{ nginx_sites_root }}
    --non-interactive --agree-tos
    --email {{ certbot_email }}
    -d {{ matrix_domains.turn }}
  args:
    creates: "/etc/letsencrypt/live/{{ matrix_domains.turn }}/fullchain.pem"
  when: not nginx_turn_cert.stat.exists
  register: certbot_turn
  changed_when: certbot_turn.rc == 0

- name: Обновить статус веб-сертификата
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ matrix_domains.synapse }}/fullchain.pem"
  register: nginx_web_cert_after

- name: Обновить статус TURN сертификата
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ matrix_domains.turn }}/fullchain.pem"
  register: nginx_turn_cert_after

- name: Проверить сертификат Matrix через openssl
  ansible.builtin.command: >
    openssl x509 -in /etc/letsencrypt/live/{{ matrix_domains.synapse }}/fullchain.pem -checkend 0 -noout
  when: nginx_web_cert_after.stat.exists
  changed_when: false

- name: Проверить сертификат TURN через openssl
  ansible.builtin.command: >
    openssl x509 -in /etc/letsencrypt/live/{{ matrix_domains.turn }}/fullchain.pem -checkend 0 -noout
  when: nginx_turn_cert_after.stat.exists
  changed_when: false

- name: Обеспечить каталог deploy hook Certbot
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Установить hook для перезагрузки сервисов после обновления сертификатов
  ansible.builtin.template:
    src: renewal-hook.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/matrix-stack.sh
    owner: root
    group: root
    mode: "0755"

- name: Развернуть боевую конфигурацию Nginx
  ansible.builtin.template:
    src: matrix.conf.j2
    dest: /etc/nginx/conf.d/10-matrix.conf
    owner: root
    group: root
    mode: "0644"
  when: nginx_web_cert_after.stat.exists and nginx_turn_cert_after.stat.exists
  notify: Reload Nginx

- name: Удалить bootstrap-конфиг после получения сертификатов
  ansible.builtin.file:
    path: /etc/nginx/conf.d/00-matrix-bootstrap.conf
    state: absent
  when: nginx_web_cert_after.stat.exists and nginx_turn_cert_after.stat.exists
  notify: Reload Nginx

- name: Проверить синтаксис Nginx
  ansible.builtin.command: nginx -t
  register: nginx_test
  changed_when: false
  failed_when: nginx_test.rc != 0

- name: Reload Nginx
  ansible.builtin.meta: flush_handlers
