---
- name: Check Nginx repository support
  ansible.builtin.assert:
    that: ["ansible_distribution == 'Ubuntu'", "ansible_distribution_release == 'noble'"]
    fail_msg: 'Matrix Deploy currently targets Ubuntu 24.04 LTS (noble).'

- name: Create apt keyring directory
  ansible.builtin.file: {path: /usr/share/keyrings, state: directory, mode: '0755'}

- name: Download Nginx signing key
  ansible.builtin.get_url:
    url: https://nginx.org/keys/nginx_signing.key
    dest: /usr/share/keyrings/nginx-archive-keyring.gpg.asc
    mode: '0644'
  register: nginx_signing_key

- name: Check existing dearmored Nginx keyring
  ansible.builtin.stat: {path: /usr/share/keyrings/nginx-archive-keyring.gpg}
  register: nginx_keyring_stat

- name: Refresh dearmored Nginx signing key when source changes
  ansible.builtin.command:
    argv: [gpg, --batch, --yes, --dearmor, --output, /usr/share/keyrings/nginx-archive-keyring.gpg, /usr/share/keyrings/nginx-archive-keyring.gpg.asc]
  when: nginx_signing_key.changed or not nginx_keyring_stat.stat.exists
  changed_when: true

- name: Check dearmored Nginx keyring
  ansible.builtin.stat: {path: /usr/share/keyrings/nginx-archive-keyring.gpg}
  register: nginx_keyring_after

- name: Require Nginx keyring
  ansible.builtin.assert: {that: [nginx_keyring_after.stat.exists]}

- name: Add Nginx mainline repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ matrix_deb_arch }} signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg]
      https://nginx.org/packages/mainline/ubuntu {{ ansible_distribution_release }} nginx
    filename: nginx-mainline
    state: present

- name: Install Nginx and Certbot
  ansible.builtin.apt:
    name: [nginx, certbot]
    state: present
    update_cache: true

- name: Remove default Nginx configuration
  ansible.builtin.file: {path: /etc/nginx/conf.d/default.conf, state: absent}
  notify: Reload Nginx

- name: Create Matrix webroot directories
  ansible.builtin.file:
    path: "{{ nginx_sites_root }}/{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  loop: ['', .well-known, .well-known/matrix, .well-known/acme-challenge]

- name: Render Matrix well-known server delegation
  ansible.builtin.template: {src: well_known_server.json.j2, dest: "{{ nginx_sites_root }}/.well-known/matrix/server", owner: www-data, group: www-data, mode: '0644'}
- name: Render Matrix client discovery
  ansible.builtin.template: {src: well_known_client.json.j2, dest: "{{ nginx_sites_root }}/.well-known/matrix/client", owner: www-data, group: www-data, mode: '0644'}

- name: Build Matrix SAN domain set
  ansible.builtin.set_fact:
    matrix_certbot_web_domains: ["{{ matrix_domains.synapse }}", "{{ matrix_domains.element }}", "{{ matrix_domains.admin }}", "{{ matrix_domains.element_call }}", "{{ matrix_domains.livekit }}"]

- name: Check existing Matrix SAN certificate
  ansible.builtin.stat: {path: "/etc/letsencrypt/live/{{ matrix_domains.synapse }}/fullchain.pem"}
  register: nginx_web_cert
- name: Check existing Matrix SAN private key
  ansible.builtin.stat: {path: "/etc/letsencrypt/live/{{ matrix_domains.synapse }}/privkey.pem"}
  register: nginx_web_key
- name: Check existing TURN certificate
  ansible.builtin.stat: {path: "/etc/letsencrypt/live/{{ matrix_domains.turn }}/fullchain.pem"}
  register: nginx_turn_cert
- name: Check existing TURN private key
  ansible.builtin.stat: {path: "/etc/letsencrypt/live/{{ matrix_domains.turn }}/privkey.pem"}
  register: nginx_turn_key

- name: Determine certificate lineage completeness
  ansible.builtin.set_fact:
    nginx_web_cert_complete: "{{ nginx_web_cert.stat.exists and nginx_web_key.stat.exists }}"
    nginx_turn_cert_complete: "{{ nginx_turn_cert.stat.exists and nginx_turn_key.stat.exists }}"

- name: Remove production Nginx config if the main TLS lineage is incomplete
  ansible.builtin.file: {path: /etc/nginx/conf.d/10-matrix.conf, state: absent}
  when: not nginx_web_cert_complete | bool
  notify: Reload Nginx

- name: Install HTTP bootstrap configuration while the main TLS lineage is incomplete
  ansible.builtin.template: {src: matrix-bootstrap.conf.j2, dest: /etc/nginx/conf.d/00-matrix-bootstrap.conf, owner: root, group: root, mode: '0644'}
  when: not nginx_web_cert_complete | bool
  notify: Reload Nginx

- name: Ensure Nginx is enabled and started
  ansible.builtin.service: {name: nginx, state: started, enabled: true}
- name: Validate bootstrap Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
- name: Apply bootstrap Nginx configuration before ACME
  ansible.builtin.meta: flush_handlers

- name: Install ACME-safe production configuration before certificate reconciliation
  ansible.builtin.template: {src: matrix.conf.j2, dest: /etc/nginx/conf.d/10-matrix.conf, owner: root, group: root, mode: '0644'}
  when: nginx_web_cert_complete | bool
  notify: Reload Nginx
- name: Validate pre-reconciliation Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  when: nginx_web_cert_complete | bool
- name: Apply ACME-safe Nginx routing before certificate reconciliation
  ansible.builtin.meta: flush_handlers

- name: Create pre-ACME challenge probe
  ansible.builtin.copy: {dest: "{{ nginx_sites_root }}/.well-known/acme-challenge/matrix-preflight", content: "matrix-acme-ok\n", owner: www-data, group: www-data, mode: '0644'}
- name: Verify HTTP-01 routing locally
  ansible.builtin.uri:
    url: http://127.0.0.1/.well-known/acme-challenge/matrix-preflight
    headers: {Host: "{{ item }}"}
    return_content: true
    status_code: 200
  loop: "{{ matrix_certbot_web_domains + [matrix_domains.turn] }}"
  register: nginx_acme_probe
  failed_when: nginx_acme_probe.content | default('') | trim != 'matrix-acme-ok'
- name: Remove pre-ACME challenge probe
  ansible.builtin.file: {path: "{{ nginx_sites_root }}/.well-known/acme-challenge/matrix-preflight", state: absent}

- name: Read Matrix certificate SANs
  ansible.builtin.command: >-
    openssl x509 -in /etc/letsencrypt/live/{{ matrix_domains.synapse }}/fullchain.pem -noout -ext subjectAltName
  register: nginx_web_cert_sans
  changed_when: false
  failed_when: false
  when: nginx_web_cert_complete | bool
- name: Read TURN certificate SANs
  ansible.builtin.command: >-
    openssl x509 -in /etc/letsencrypt/live/{{ matrix_domains.turn }}/fullchain.pem -noout -ext subjectAltName
  register: nginx_turn_cert_sans
  changed_when: false
  failed_when: false
  when: nginx_turn_cert_complete | bool

- name: Determine certificate reconciliation requirements
  ansible.builtin.set_fact:
    nginx_web_cert_actual_domains: "{{ (nginx_web_cert_sans.stdout | default('') | regex_findall('DNS:([^,\\s]+)')) | sort }}"
    nginx_turn_cert_actual_domains: "{{ (nginx_turn_cert_sans.stdout | default('') | regex_findall('DNS:([^,\\s]+)')) | sort }}"

- name: Reconcile Matrix SAN certificate
  ansible.builtin.command: >-
    certbot certonly --webroot --webroot-path {{ nginx_sites_root | quote }}
    --non-interactive --agree-tos --email {{ certbot_email | quote }}
    --cert-name {{ matrix_domains.synapse | quote }} --force-renewal
    {% for domain in matrix_certbot_web_domains %}-d {{ domain | quote }} {% endfor %}
  when: (not nginx_web_cert_complete | bool) or ((nginx_web_cert_actual_domains | sort) != (matrix_certbot_web_domains | sort))
  register: certbot_web
  changed_when: certbot_web.rc == 0

- name: Reconcile TURN certificate
  ansible.builtin.command: >-
    certbot certonly --webroot --webroot-path {{ nginx_sites_root | quote }}
    --non-interactive --agree-tos --email {{ certbot_email | quote }}
    --cert-name {{ matrix_domains.turn | quote }} --force-renewal -d {{ matrix_domains.turn | quote }}
  when: (not nginx_turn_cert_complete | bool) or ((nginx_turn_cert_actual_domains | sort) != ([matrix_domains.turn] | sort))
  register: certbot_turn
  changed_when: certbot_turn.rc == 0

- name: Verify Matrix certificate exists after reconciliation
  ansible.builtin.stat: {path: "/etc/letsencrypt/live/{{ matrix_domains.synapse }}/fullchain.pem"}
  register: nginx_web_cert_after
- name: Verify Matrix private key exists after reconciliation
  ansible.builtin.stat: {path: "/etc/letsencrypt/live/{{ matrix_domains.synapse }}/privkey.pem"}
  register: nginx_web_key_after
- name: Verify TURN certificate exists after reconciliation
  ansible.builtin.stat: {path: "/etc/letsencrypt/live/{{ matrix_domains.turn }}/fullchain.pem"}
  register: nginx_turn_cert_after
- name: Verify TURN private key exists after reconciliation
  ansible.builtin.stat: {path: "/etc/letsencrypt/live/{{ matrix_domains.turn }}/privkey.pem"}
  register: nginx_turn_key_after
- name: Require both complete certificate lineages
  ansible.builtin.assert:
    that:
      - nginx_web_cert_after.stat.exists
      - nginx_web_key_after.stat.exists
      - nginx_turn_cert_after.stat.exists
      - nginx_turn_key_after.stat.exists

- name: Check Matrix certificate validity
  ansible.builtin.command: "openssl x509 -in /etc/letsencrypt/live/{{ matrix_domains.synapse }}/fullchain.pem -checkend 0 -noout"
  changed_when: false
- name: Check TURN certificate validity
  ansible.builtin.command: "openssl x509 -in /etc/letsencrypt/live/{{ matrix_domains.turn }}/fullchain.pem -checkend 0 -noout"
  changed_when: false

- name: Install selective Certbot deploy hook
  ansible.builtin.template: {src: renewal-hook.sh.j2, dest: /etc/letsencrypt/renewal-hooks/deploy/matrix-stack.sh, owner: root, group: root, mode: '0755'}
- name: Validate Certbot deploy hook syntax
  ansible.builtin.command: bash -n /etc/letsencrypt/renewal-hooks/deploy/matrix-stack.sh
  changed_when: false
- name: Enable Certbot renewal timer
  ansible.builtin.systemd: {name: certbot.timer, enabled: true, state: started}

- name: Render production Nginx configuration
  ansible.builtin.template: {src: matrix.conf.j2, dest: /etc/nginx/conf.d/10-matrix.conf, owner: root, group: root, mode: '0644'}
  notify: Reload Nginx
- name: Remove bootstrap Nginx configuration
  ansible.builtin.file: {path: /etc/nginx/conf.d/00-matrix-bootstrap.conf, state: absent}
  notify: Reload Nginx
- name: Validate production Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
- name: Apply production Nginx configuration
  ansible.builtin.meta: flush_handlers
