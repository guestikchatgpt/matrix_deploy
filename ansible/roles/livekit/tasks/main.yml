---
- name: Create LiveKit directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ livekit_root }}", mode: '0750' }
    - { path: "{{ livekit_cert_dir }}", mode: '0700' }

- name: Copy Matrix SAN certificate for LiveKit embedded TURN
  ansible.builtin.copy:
    src: "/etc/letsencrypt/live/{{ matrix_domains.synapse }}/fullchain.pem"
    dest: "{{ livekit_cert_dir }}/turn.crt"
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  notify: Restart LiveKit

- name: Copy Matrix SAN private key for LiveKit embedded TURN
  ansible.builtin.copy:
    src: "/etc/letsencrypt/live/{{ matrix_domains.synapse }}/privkey.pem"
    dest: "{{ livekit_cert_dir }}/turn.key"
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  notify: Restart LiveKit

- name: Render LiveKit configuration
  ansible.builtin.template:
    src: livekit.yaml.j2
    dest: "{{ livekit_config_path }}"
    owner: root
    group: root
    mode: '0600'
  notify: Restart LiveKit

- name: Run LiveKit container
  community.docker.docker_container:
    name: livekit
    image: "{{ livekit_image }}"
    restart_policy: always
    pull: missing
    network_mode: host
    user: '0'
    command:
      - --config
      - /etc/livekit.yaml
    volumes:
      - "{{ livekit_config_path }}:/etc/livekit.yaml:ro"
      - "{{ livekit_cert_dir }}:/etc/ssl/livekit:ro"
    state: started

- name: Apply LiveKit configuration changes
  ansible.builtin.meta: flush_handlers

- name: Wait for LiveKit API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ livekit_http_port }}/"
    status_code: 200
    timeout: 5
  register: livekit_ready
  retries: 20
  delay: 2
  until: livekit_ready.status | default(0) == 200
  when: not ansible_check_mode
