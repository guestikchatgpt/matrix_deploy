---
- name: Проверить поддержку репозитория Docker для текущего дистрибутива
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_release in ["noble", "jammy", "focal"]
    fail_msg: "Официальный репозиторий Docker не поддерживает {{ ansible_distribution }} {{ ansible_distribution_release }}. Проверьте https://docs.docker.com/engine/install/ и при необходимости обновите плейбук."

- name: Создать директорию для ключей apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Добавить GPG ключ Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Добавить репозиторий Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ matrix_deb_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Установить Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Включить и запустить Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ensure Matrix service account is not granted Docker socket access
  ansible.builtin.user:
    name: "{{ matrix_system_user }}"
    groups: docker
    append: false
  register: matrix_docker_group_cleanup
  failed_when: false

- name: Создать docker сеть
  community.docker.docker_network:
    name: "{{ docker_network_name }}"
    state: present
    ipam_config:
      - subnet: "{{ docker_network_subnet }}"
