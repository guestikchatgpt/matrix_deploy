---
- name: Проверить поддержку репозитория Docker для текущего дистрибутива
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_release'] == "noble"
    fail_msg: "Matrix Deploy поддерживает Docker deployment только на Ubuntu 24.04 LTS (noble)."

- name: Создать директорию для ключей apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Добавить GPG ключ Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Remove legacy Docker apt source format
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Добавить репозиторий Docker
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - "{{ matrix_deb_arch }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Установить Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Включить и запустить Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Require resolved application image lock
  ansible.builtin.assert:
    that:
      - matrix_resolved_images is defined
      - matrix_resolved_images is sequence
      - matrix_resolved_images | length == matrix_version_sources | length
      - matrix_resolved_images | select('search', ':latest$') | list | length == 0
    fail_msg: >-
      Exact application image references are missing. Run Matrix Deploy preflight
      so /etc/matrix-deploy/versions.yml is resolved before the Docker role.

- name: Create dockerd systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: matrix_registry_proxy | length > 0

- name: Configure dockerd HTTP(S) proxy for registry access
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/http-proxy.conf
    owner: root
    group: root
    mode: '0600'
    content: |
      # Managed by Matrix Deploy (matrix_registry_proxy)
      [Service]
      Environment="HTTP_PROXY={{ matrix_registry_proxy }}"
      Environment="HTTPS_PROXY={{ matrix_registry_proxy }}"
      Environment="NO_PROXY={{ matrix_registry_no_proxy }}"
  register: docker_proxy_dropin_present
  when: matrix_registry_proxy | length > 0
  no_log: true

- name: Remove dockerd proxy drop-in when no proxy is configured
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d/http-proxy.conf
    state: absent
  register: docker_proxy_dropin_absent
  when: matrix_registry_proxy | length == 0

- name: Apply dockerd proxy change
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
  when:
    - not ansible_check_mode
    - (docker_proxy_dropin_present is changed) or (docker_proxy_dropin_absent is changed)

# Pulls by manifest digest with fallback: upstream registry -> official
# alternate registry -> public mirrors (tools/pull_images.py).
- name: Pre-pull exact images selected by preflight
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/../../tools/pull_images.py"
      - --lock
      - "{{ matrix_version_lock_file }}"
      - --policy
      - "{{ playbook_dir }}/../inventory/group_vars/all/versions.yml"
      - --mirrors-json
      - "{{ matrix_registry_mirrors | to_json }}"
      - --arch
      - "{{ matrix_deb_arch }}"
      - --timeout
      - "{{ matrix_image_pull_timeout | string }}"
  register: docker_image_pull_result
  changed_when: "'PULLED ' in docker_image_pull_result.stdout"
  when: not ansible_check_mode

- name: Show image sources
  ansible.builtin.debug:
    msg: "{{ docker_image_pull_result.stdout_lines }}"
  when:
    - not ansible_check_mode
    - docker_image_pull_result.stdout_lines is defined

- name: Ensure Matrix service account has no supplementary groups
  ansible.builtin.user:
    name: "{{ matrix_system_user }}"
    groups: ''
    append: false

- name: Создать docker сеть
  community.docker.docker_network:
    name: "{{ docker_network_name }}"
    state: present
    ipam_config:
      - subnet: "{{ docker_network_subnet }}"
        gateway: "{{ docker_network_gateway }}"
