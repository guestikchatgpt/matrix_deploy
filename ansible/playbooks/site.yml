---
- name: Deploy Matrix Synapse stack
  hosts: matrix_hosts
  become: true
  gather_facts: true

  module_defaults:
    community.docker.docker_container:
      log_driver: "{{ docker_container_log_driver }}"
      log_options: "{{ docker_container_log_options }}"

  vars_prompt:
    - name: matrix_base_domain
      prompt: "Базовый домен (например example.com)"
      private: no
      default: "example.com"
    - name: certbot_email
      prompt: "Email для Let's Encrypt"
      private: no

  vars:
    matrix_admin_user: admin

  pre_tasks:
    - name: Require resolved version lock before any deployment mutation
      ansible.builtin.assert:
        that:
          - matrix_version_lock is defined
          - matrix_version_lock is mapping
          - matrix_version_lock.schema | int == 1
          - matrix_resolved_images is defined
          - matrix_resolved_images is sequence
          - matrix_resolved_images | length == matrix_version_sources | length
          - postgresql_image is defined
          - synapse_image is defined
          - element_web_image is defined
          - element_call_image is defined
          - livekit_image is defined
          - element_jwt_image is defined
          - synad_image is defined
        fail_msg: >-
          Resolved application versions are missing. Run bootstrap/deploy or
          converge.sh so preflight creates /etc/matrix-deploy/versions.yml, then
          pass that lock to site.yml.

    - name: Prepare local persistent secret directory before controller lookups
      ansible.builtin.file:
        path: "{{ matrix_root_dir }}/.secrets"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Задать путь к секрету TURN
      set_fact:
        turn_secret_path: "{{ matrix_root_dir }}/.secrets/turn_shared_secret"

    - name: Подготовить общий секрет для TURN
      set_fact:
        turn_shared_secret: "{{ lookup('password', turn_secret_path + ' length=64 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Подготовить секреты LiveKit
      set_fact:
        livekit_api_key: "{{ lookup('password', matrix_root_dir + '/.secrets/livekit_api_key length=20 chars=ascii_uppercase,digits') }}"
        livekit_api_secret: "{{ lookup('password', matrix_root_dir + '/.secrets/livekit_api_secret length=64 chars=ascii_letters,digits') }}"
      no_log: true

  roles:
    - role: common
    - role: firewall
    - role: fail2ban
    - role: docker
    - role: nginx
    - role: postgres
    - role: synapse
    - role: element_web
    - role: element_call
    - role: synad
    - role: livekit
    - role: element_jwt
    - role: coturn
    - role: verification
