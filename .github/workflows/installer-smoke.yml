name: installer-smoke

on:
  push:
    paths:
      - 'install.sh'
      - 'bootstrap.sh'
      - 'scripts/**'
      - 'tests/installer-smoke.sh'
      - '.github/workflows/installer-smoke.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'bootstrap.sh'
      - 'scripts/**'
      - 'tests/installer-smoke.sh'
      - '.github/workflows/installer-smoke.yml'

jobs:
  shell-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/installer-smoke.sh
