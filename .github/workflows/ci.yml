name: matrix-deploy-ci

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  static-and-ansible-syntax:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check ansible-core==2.21.4 PyYAML
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Parse YAML and enforce deployment invariants
        run: python tools/static_checks.py

      - name: Validate shell and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in ./*.sh scripts/* tests/*.sh; do
            bash -n "$script"
          done
          python -m py_compile tools/resolve_versions.py tools/static_checks.py

      - name: Unit-test version resolver policy (offline)
        run: python -m unittest tests/test_resolve_versions.py tests/test_registry_fallback.py -v

      - name: Exercise bootstrap preparation on Ubuntu 24.04
        shell: bash
        run: sudo ./bootstrap.sh --prepare-only

      - name: Exercise NAT preflight and dynamic stable-version resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          sudo rm -f /etc/matrix-deploy/versions.yml

          relay_ip="$(ip -4 route get 1.1.1.1 | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}')"
          test -n "$relay_ip"

          public_ip='8.8.8.8'
          base_domain='8-8-8-8.sslip.io'

          cat > /tmp/matrix-ci-preflight.yml <<EOF
          ---
          matrix_base_domain: "${base_domain}"
          matrix_external_ip: "${public_ip}"
          certbot_email: "ci@example.invalid"
          matrix_ssh_port: 22
          matrix_ipv6_enabled: false
          synapse_enable_federation: true
          coturn_network_mode: "nat"
          coturn_relay_ip: "${relay_ip}"
          EOF

          (
            cd ansible
            sudo --preserve-env=GITHUB_TOKEN ../.venv/bin/ansible-playbook playbooks/preflight.yml \
              --extra-vars '@/tmp/matrix-ci-preflight.yml' \
              --extra-vars 'matrix_refresh_versions=true'
          )

          sudo test -s /etc/matrix-deploy/versions.yml
          sudo cat /etc/matrix-deploy/versions.yml

      - name: Verify routine preflight checks but does not rewrite version lock
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          before="$(sudo sha256sum /etc/matrix-deploy/versions.yml | awk '{print $1}')"

          (
            cd ansible
            sudo --preserve-env=GITHUB_TOKEN ../.venv/bin/ansible-playbook playbooks/preflight.yml \
              --extra-vars '@/tmp/matrix-ci-preflight.yml' \
              --extra-vars 'matrix_refresh_versions=false'
          )

          after="$(sudo sha256sum /etc/matrix-deploy/versions.yml | awk '{print $1}')"
          test "$before" = "$after"
          printf 'Version lock unchanged on routine preflight: %s\n' "$after"

      - name: Validate dynamically resolved image references and architectures
        shell: bash
        run: |
          set -euo pipefail
          sudo python - <<'PY' > /tmp/matrix-deploy-images.txt
          import pathlib
          import yaml

          lock = yaml.safe_load(
              pathlib.Path('/etc/matrix-deploy/versions.yml').read_text()
          ) or {}
          images = lock.get('matrix_resolved_images') or []
          if len(images) != 7:
              raise SystemExit(f'expected 7 resolved images, got {len(images)}: {images}')
          print('\n'.join(images))
          PY

          while IFS= read -r image; do
            printf 'Checking resolved image manifest: %s\n' "$image"
            manifest="/tmp/matrix-image-manifest.json"
            docker manifest inspect "$image" > "$manifest"
            python - "$image" "$manifest" <<'PY'
          import json
          import sys

          image = sys.argv[1]
          with open(sys.argv[2], encoding='utf-8') as fh:
              manifest = json.load(fh)

          platforms = {
              (entry.get('platform', {}).get('os'), entry.get('platform', {}).get('architecture'))
              for entry in manifest.get('manifests', [])
          }
          required = {('linux', 'amd64'), ('linux', 'arm64')}
          missing = sorted(required - platforms)
          if missing:
              raise SystemExit(f'{image} is missing required platforms: {missing}; found={sorted(platforms)}')
          print(f'{image}: amd64+arm64 OK')
          PY
          done < /tmp/matrix-deploy-images.txt

      - name: Probe public registry mirrors (informational)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo cp /etc/matrix-deploy/versions.yml /tmp/matrix-probe-lock.yml
          sudo chmod 0644 /tmp/matrix-probe-lock.yml
          python - <<'PY'
          import sys, yaml
          sys.path.insert(0, 'tools')
          import registry
          lock = yaml.safe_load(open('/tmp/matrix-probe-lock.yml'))
          policy = yaml.safe_load(open('ansible/inventory/group_vars/all/versions.yml'))
          mirrors = yaml.safe_load(open('ansible/inventory/group_vars/all/main.yml'))['matrix_registry_mirrors']
          for name, item in lock['matrix_version_lock']['components'].items():
              alternates = policy['matrix_version_sources'][name].get('alternate_images') or []
              tag = registry.parse_image(item['image']).tag
              for source in registry.candidate_sources(item['image'], alternates, mirrors)[1:]:
                  try:
                      digest = registry.manifest_digest(
                          registry.skopeo_raw_manifest(source.tagged(tag), timeout=60, attempts=1))
                      state = 'SAME DIGEST' if digest == item['digest'] else f'DIFFERENT {digest[:19]}'
                  except registry.RegistryError as exc:
                      state = f'UNREACHABLE {str(exc)[-120:]}'
                  print(f'{name:13s} {source.kind:9s} {source.repository:55s} {state}')
          PY

      - name: Show Ansible versions
        working-directory: ansible
        run: |
          ansible-playbook --version
          ansible-galaxy collection list

      - name: Validate inventory
        working-directory: ansible
        run: ansible-inventory --graph

      - name: Syntax-check playbooks
        working-directory: ansible
        shell: bash
        run: |
          set -euo pipefail
          for playbook in \
            playbooks/preflight.yml \
            playbooks/site.yml \
            playbooks/verify.yml \
            playbooks/backup.yml \
            playbooks/destroy.yml
          do
            ansible-playbook "$playbook" \
              --syntax-check \
              --extra-vars '@../tests/ci-vars.yml'
          done

      - name: Render and syntax-check verifier variants using resolved lock
        working-directory: ansible
        shell: bash
        run: |
          set -euo pipefail

          sudo cp /etc/matrix-deploy/versions.yml /tmp/matrix-ci-versions.yml
          sudo chown "$(id -u):$(id -g)" /tmp/matrix-ci-versions.yml
          chmod 0600 /tmp/matrix-ci-versions.yml

          for federation in true false; do
            output="/tmp/matrix-stack-verify-${federation}.sh"
            ansible localhost \
              -m ansible.builtin.template \
              -a "src=roles/verification/templates/verify.sh.j2 dest=${output} mode=0755" \
              --extra-vars '@../tests/ci-vars.yml' \
              --extra-vars '@/tmp/matrix-ci-versions.yml' \
              --extra-vars "synapse_enable_federation=${federation}"
            bash -n "$output"
          done
