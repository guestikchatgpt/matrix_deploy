name: matrix-deploy-ci

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  static-and-ansible-syntax:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check ansible-core==2.21.2 PyYAML
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Parse YAML and enforce deployment invariants
        run: python tools/static_checks.py

      - name: Validate pinned container image references and architectures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/matrix-deploy-images.txt
          import pathlib
          import yaml

          versions = yaml.safe_load(
              pathlib.Path('ansible/inventory/group_vars/all/versions.yml').read_text()
          ) or {}
          images = sorted(
              value for key, value in versions.items()
              if key.endswith('_image') and isinstance(value, str)
          )
          if not images:
              raise SystemExit('no container image references found')
          print('\n'.join(images))
          PY

          while IFS= read -r image; do
            printf 'Checking image manifest: %s\n' "$image"
            manifest="/tmp/matrix-image-manifest.json"
            docker manifest inspect "$image" > "$manifest"
            python - "$image" "$manifest" <<'PY'
          import json
          import sys

          image = sys.argv[1]
          with open(sys.argv[2], encoding='utf-8') as fh:
              manifest = json.load(fh)

          platforms = {
              (entry.get('platform', {}).get('os'), entry.get('platform', {}).get('architecture'))
              for entry in manifest.get('manifests', [])
          }
          required = {('linux', 'amd64'), ('linux', 'arm64')}
          missing = sorted(required - platforms)
          if missing:
              raise SystemExit(f'{image} is missing required platforms: {missing}; found={sorted(platforms)}')
          print(f'{image}: amd64+arm64 OK')
          PY
          done < /tmp/matrix-deploy-images.txt

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in ./*.sh; do
            bash -n "$script"
          done

      - name: Exercise bootstrap preparation on Ubuntu 24.04
        shell: bash
        run: sudo ./bootstrap.sh --prepare-only

      - name: Exercise NAT preflight runtime on a fresh runner
        shell: bash
        run: |
          set -euo pipefail

          relay_ip="$(ip -4 route get 1.1.1.1 | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}')"
          test -n "$relay_ip"

          # sslip.io resolves arbitrary subdomains containing this IPv4 to the
          # encoded address, so this exercises real DNS A/AAAA queries without
          # mutating /etc/hosts or requiring project-owned test DNS.
          public_ip='8.8.8.8'
          base_domain='8-8-8-8.sslip.io'

          cat > /tmp/matrix-ci-preflight.yml <<EOF
          ---
          matrix_base_domain: "${base_domain}"
          matrix_external_ip: "${public_ip}"
          certbot_email: "ci@example.invalid"
          matrix_ssh_port: 22
          matrix_ipv6_enabled: false
          synapse_enable_federation: true
          coturn_network_mode: "nat"
          coturn_relay_ip: "${relay_ip}"
          EOF

          (
            cd ansible
            sudo ../.venv/bin/ansible-playbook playbooks/preflight.yml \
              --extra-vars '@/tmp/matrix-ci-preflight.yml'
          )

      - name: Show Ansible versions
        working-directory: ansible
        run: |
          ansible-playbook --version
          ansible-galaxy collection list

      - name: Validate inventory
        working-directory: ansible
        run: ansible-inventory --graph

      - name: Syntax-check playbooks
        working-directory: ansible
        shell: bash
        run: |
          set -euo pipefail
          for playbook in \
            playbooks/preflight.yml \
            playbooks/site.yml \
            playbooks/verify.yml \
            playbooks/backup.yml \
            playbooks/destroy.yml
          do
            ansible-playbook "$playbook" \
              --syntax-check \
              --extra-vars '@../tests/ci-vars.yml'
          done

      - name: Render and syntax-check verifier variants
        working-directory: ansible
        shell: bash
        run: |
          set -euo pipefail
          for federation in true false; do
            output="/tmp/matrix-stack-verify-${federation}.sh"
            ansible localhost \
              -m ansible.builtin.template \
              -a "src=roles/verification/templates/verify.sh.j2 dest=${output} mode=0755" \
              --extra-vars '@../tests/ci-vars.yml' \
              --extra-vars "synapse_enable_federation=${federation}"
            bash -n "$output"
          done
